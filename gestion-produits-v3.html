<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>MON COMMERCE · Mes produits V3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="./owner-phone-mfa-v1.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5efe7;color:#2b211b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(780px,calc(100% - 24px));margin:22px auto}.card{background:white;border:1px solid #e5d8ca;border-radius:20px;padding:16px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap}input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #e5d8ca;border-radius:10px}.half{flex:1;min-width:180px}.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:900;background:#173b31;color:white}.ghost{background:white;color:#2b211b;border:1px solid #e5d8ca}.danger{background:#8a2a2a}.product{display:grid;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #eee}.product img{width:86px;height:86px;object-fit:cover;border-radius:12px;border:1px solid #e5d8ca}.productHead{display:flex;gap:10px;align-items:flex-start}.productInfo{display:grid;gap:4px}.msg{font-size:12px;color:#79695d}.bad{color:#8a2a2a}.order{display:grid;gap:8px;margin-top:12px;padding:12px;border:1px solid #e5d8ca;border-radius:14px}.order strong{font-size:16px}.orderStatus{display:inline-flex;width:max-content;align-items:center;padding:6px 10px;border-radius:999px;font-weight:950;font-size:12px}.orderStatus.request{background:#fff1c9;color:#7a4b00}.orderStatus.confirmed{background:#e8f1ff;color:#234b8a}.orderStatus.paid{background:#e9f8ef;color:#126b42}.orderStatus.refused{background:#fdecec;color:#9b1c1c}.orderStatus.completed{background:#efefef;color:#4e4e4e}.orderMeta{font-size:13px;color:#79695d}.orderTotal{font-weight:950;color:#173b31}.orderCount{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#173b31;color:white;font-size:12px;font-weight:950;margin-left:6px}.btn.confirm{background:#e8f1ff;color:#234b8a}.btn.paid{background:#e9f8ef;color:#126b42}.btn.complete{background:#efefef;color:#333}.btn.refuse{background:#fdecec;color:#9b1c1c}
</style></head><body><main class="wrap"><div class="card"><strong>🛍️ MON COMMERCE · Gestion propriétaire</strong><p id="status" class="msg">Vérification de votre accès…</p><div class="row"><a id="back" class="btn ghost" href="./index.html">← Retour à la fiche</a><button id="logout" class="btn ghost">Déconnexion</button></div></div><section id="editor" class="card" hidden><h2>Produits</h2><div class="row"><input class="half" id="name" placeholder="Nom du produit"><input class="half" id="price" placeholder="Prix affiché"><input class="half" id="stock" placeholder="Disponibilité / stock"></div><textarea id="description" rows="3" placeholder="Description"></textarea><input id="image" placeholder="URL image publique"><div class="row"><input class="half" id="position" type="number" min="0" step="10" placeholder="Ordre d’affichage (auto si vide)"><select class="half" id="active" style="padding:10px;border:1px solid #e5d8ca;border-radius:10px;background:white"><option value="true">Publié</option><option value="false">Masqué</option></select></div><button id="add" class="btn">Ajouter le produit</button><div id="products"></div></section><section id="ordersCard" class="card" hidden><h2>Commandes <span id="newOrderCount" class="orderCount" hidden>0</span></h2><p class="msg">Commandes reçues depuis la boutique et le panier MON COMMERCE. Paiement direct commerçant · Wave Pro / Sendwave · 0 % commission DIGIY.</p><div id="orders"></div></section></main><script>
(async()=>{
  const $=id=>document.getElementById(id);
  const status=$("status");
  try{
    const sb=window.supabase.createClient(
      "https://wesqmwjjtsefyjnluosj.supabase.co",
      "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3",
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
    );

    const params=new URL(location.href).searchParams;
    let site=(params.get("site")||"").trim();
    let ret=(params.get("return")||"").trim();

    const {data:{user},error:userError}=await sb.auth.getUser();
    if(userError) throw userError;
    if(!user){
      status.textContent="Connexion requise.";
      status.classList.add("bad");
      return;
    }

    // Fail closed before any commerce/order read: products already require MFA in SQL.
    if(!window.DIGIY_OWNER_PHONE_MFA?.guard){
      status.textContent="Contrôle téléphone indisponible. Aucun accès propriétaire n’est ouvert.";
      status.classList.add("bad");
      return;
    }
    const phoneVerified=await window.DIGIY_OWNER_PHONE_MFA.guard({supabase:sb,beforeId:"editor"});
    if(!phoneVerified){
      status.textContent="Vérification du téléphone requise avant l'accès aux produits et commandes.";
      status.classList.add("bad");
      return;
    }

    if(!site){
      const {data:owned,error:ownedError}=await sb
        .from("digiy_commerce_sites")
        .select("slug,name")
        .eq("auth_user_id",user.id)
        .eq("is_active",true)
        .order("name",{ascending:true});

      if(ownedError) throw ownedError;
      if(!owned?.length){
        status.textContent="Aucun commerce actif n’est rattaché à ce compte.";
        status.classList.add("bad");
        return;
      }
      site=owned[0].slug;
    }

    const {data:shop,error:shopError}=await sb
      .from("digiy_commerce_sites")
      .select("slug,name")
      .eq("slug",site)
      .eq("auth_user_id",user.id)
      .eq("is_active",true)
      .maybeSingle();

    if(shopError) throw shopError;
    if(!shop){
      status.textContent="Cet email n’est pas autorisé pour ce commerce.";
      status.classList.add("bad");
      return;
    }

    if(!ret && site==="astou-boutique"){
      ret="https://mon-commerce.digiylyfe.com/fiche-astou.html";
    }
    if(!ret) ret="./index.html";

    try{
      const u=new URL(ret,location.origin);
      if(u.origin===location.origin||u.hostname.endsWith(".digiylyfe.com")) $("back").href=u.href;
    }catch(_){}

    status.textContent="Accès confirmé · "+shop.name;
    $("editor").hidden=false;
    $("ordersCard").hidden=false;

    async function load(){
      const {data,error}=await sb
        .from("digiy_commerce_products")
        .select("id,name,description,price_label,stock_label,image_url,position,is_active")
        .eq("site_slug",site)
        .order("position",{ascending:true});
      if(error) throw error;
      $("products").innerHTML="";
      (data||[]).forEach(x=>{
        const d=document.createElement("div");
        d.className="product";
        d.innerHTML='<div class="productHead"><div class="thumb"></div><div class="productInfo"><strong></strong><div class="msg meta"></div><div class="msg desc"></div></div></div><div class="row"><button class="btn ghost edit">Modifier</button><button class="btn ghost toggle"></button><button class="btn danger del">Supprimer</button></div>';
        d.querySelector("strong").textContent=x.name;
        d.querySelector(".meta").textContent=[x.price_label,x.stock_label,"Ordre "+x.position,(x.is_active?"Publié":"Masqué")].filter(Boolean).join(" · ");
        d.querySelector(".desc").textContent=x.description||"";
        if(x.image_url){const img=document.createElement("img");img.src=x.image_url;img.alt=x.name||"Produit";img.loading="lazy";d.querySelector(".thumb").appendChild(img)}
        d.querySelector(".toggle").textContent=x.is_active?"Masquer":"Publier";
        d.querySelector(".edit").onclick=async()=>{
          const name=prompt("Nom",x.name);
          if(name===null)return;
          const price=prompt("Prix affiché",x.price_label||"");
          if(price===null)return;
          const stock=prompt("Disponibilité / stock",x.stock_label||"");
          if(stock===null)return;
          const description=prompt("Description",x.description||"");
          if(description===null)return;
          const image_url=prompt("URL image publique",x.image_url||"");
          if(image_url===null)return;
          const pos=prompt("Ordre d’affichage",String(x.position??0));
          if(pos===null)return;
          const position=Number.isFinite(Number(pos))?Number(pos):x.position;
          const {error}=await sb.from("digiy_commerce_products").update({
            name,
            price_label:price||null,
            stock_label:stock||null,
            description:description||null,
            image_url:image_url||null,
            position,
            updated_at:new Date().toISOString()
          }).eq("id",x.id);
          if(error) alert(error.message); else load();
        };
        d.querySelector(".toggle").onclick=async()=>{
          const {error}=await sb.from("digiy_commerce_products").update({is_active:!x.is_active,updated_at:new Date().toISOString()}).eq("id",x.id);
          if(error)alert(error.message);else load();
        };
        d.querySelector(".del").onclick=async()=>{
          if(!confirm("Supprimer ce produit ?")) return;
          const {error}=await sb.from("digiy_commerce_products").delete().eq("id",x.id);
          if(error) alert(error.message); else load();
        };
        $("products").appendChild(d);
      });
    }

    $("add").onclick=async()=>{
      const name=$("name").value.trim();
      if(!name) return alert("Nom requis");
      const manualPosition=$("position").value.trim();
      let position=Number(manualPosition);
      if(!manualPosition||!Number.isFinite(position)){
        const {data:last}=await sb.from("digiy_commerce_products").select("position").eq("site_slug",site).order("position",{ascending:false}).limit(1);
        position=(last?.[0]?.position||0)+10;
      }
      const {error}=await sb.from("digiy_commerce_products").insert({
        site_slug:site,
        name,
        description:$("description").value.trim()||null,
        price_label:$("price").value.trim()||null,
        stock_label:$("stock").value.trim()||null,
        image_url:$("image").value.trim()||null,
        position,
        is_active:$("active").value==="true"
      });
      if(error) alert(error.message);
      else{
        $("name").value=$("price").value=$("stock").value=$("description").value=$("image").value=$("position").value="";$("active").value="true";
        load();
      }
    };

    async function loadOrders(){
      const {data,error}=await sb
        .from("digiy_commerce_orders")
        .select("id,product_name,quantity,customer_name,customer_phone,message,status,created_at,country,city,delivery_address,currency,order_source")
        .eq("site_slug",site)
        .order("created_at",{ascending:false});
      if(error) throw error;
      const box=$("orders");
      box.innerHTML="";
      if(!data?.length){
        box.innerHTML='<div class="msg">Aucune commande reçue pour le moment.</div>';
        return;
      }
      const labels={request:"Nouvelle",confirmed:"Confirmée",paid:"Payée · Wave Pro",refused:"Refusée",completed:"Terminée"};
      const ids=data.map(o=>o.id);
      let itemsByOrder={};
      if(ids.length){
        const {data:itemRows,error:itemError}=await sb
          .from("digiy_commerce_order_items")
          .select("order_id,product_name,quantity,unit_price_label,variant,position")
          .in("order_id",ids)
          .order("position",{ascending:true});
        if(itemError) throw itemError;
        for(const row of (itemRows||[])){
          (itemsByOrder[row.order_id]||(itemsByOrder[row.order_id]=[])).push(row);
        }
      }
      const newCount=(data||[]).filter(o=>o.status==="request").length;
      const countEl=$("newOrderCount");
      if(countEl){countEl.textContent=String(newCount);countEl.hidden=newCount===0}
      for(const o of data){
        const d=document.createElement("div");
        d.className="order";
        const waText="Bonjour "+o.customer_name+", concernant votre commande "+o.product_name+" x"+o.quantity+" chez "+shop.name+".";
        const wa="https://wa.me/"+String(o.customer_phone||"").replace(/\D/g,"")+"?text="+encodeURIComponent(waText);
        d.innerHTML='<strong></strong><div class="orderMeta meta"></div><div class="orderMeta destination"></div><div class="orderMeta lines"></div><div class="orderTotal"></div><div class="orderMeta note"></div><div class="orderStatus"></div><div class="row"><a class="btn ghost wa" target="_blank" rel="noopener">WhatsApp client</a><button class="btn ghost confirm">Confirmer</button><button class="btn ghost paid">Payée Wave Pro</button><button class="btn ghost complete">Terminer</button><button class="btn ghost refuse">Refuser</button><button class="btn danger remove">Effacer</button></div>';
        d.querySelector("strong").textContent=o.product_name+" × "+o.quantity+" — "+o.customer_name;
        d.querySelector(".meta").textContent=o.customer_phone+" · "+new Date(o.created_at).toLocaleString("fr-FR")+(o.order_source==="cart"?" · Panier":"");
        d.querySelector(".destination").textContent=[o.country,o.city,o.delivery_address,o.currency].filter(Boolean).join(" · ");
        const lines=itemsByOrder[o.id]||[];
        // Customer-entered item fields are untrusted: render as text, never HTML.
        const itemLines=d.querySelector(".lines");
        for(const x of lines){
          const entry=document.createElement("div");
          entry.textContent="• "+String(x.product_name)+" × "+String(x.quantity)+(x.unit_price_label?" · "+String(x.unit_price_label):"")+(x.variant?" · "+String(x.variant):"");
          itemLines.appendChild(entry);
        }
        const totalFcfa=lines.reduce((sum,x)=>{
          const unit=Number(String(x.unit_price_label||"").replace(/[^0-9]/g,""))||0;
          return sum+unit*(Number(x.quantity)||0);
        },0);
        d.querySelector(".orderTotal").textContent=totalFcfa?("Total indicatif : "+new Intl.NumberFormat("fr-FR").format(totalFcfa)+" FCFA"):"";
        d.querySelector(".note").textContent=o.message||"";
        const statusEl=d.querySelector(".orderStatus");
        statusEl.textContent=labels[o.status]||o.status;
        statusEl.className="orderStatus "+(o.status||"");
        d.querySelector(".wa").href=wa;
        async function setStatus(next){
          const {error}=await sb.from("digiy_commerce_orders").update({status:next,updated_at:new Date().toISOString()}).eq("id",o.id);
          if(error) alert(error.message); else loadOrders();
        }
        d.querySelector(".confirm").onclick=()=>setStatus("confirmed");
        d.querySelector(".paid").onclick=()=>setStatus("paid");
        d.querySelector(".complete").onclick=()=>setStatus("completed");
        d.querySelector(".refuse").onclick=()=>setStatus("refused");
        d.querySelector(".remove").onclick=async()=>{
          if(!confirm("Effacer cette commande du carnet DIGIY ?")) return;
          const {error}=await sb.from("digiy_commerce_orders").delete().eq("id",o.id);
          if(error) alert(error.message); else loadOrders();
        };
        box.appendChild(d);
      }
    }

    $("logout").onclick=async()=>{
      await sb.auth.signOut();
      location.href=$("back").href;
    };

    await load();
    await loadOrders();
  }catch(err){
    console.error(err);
    status.textContent="Erreur de gestion : "+(err?.message||String(err));
    status.classList.add("bad");
  }
})();
</script></body></html>
