<body>
  <p class="loading">MON COMMERCE — chargement…</p>
  <script>
  (function(){
    var VERSION='20260805-commerce-fg-nails-7l';
    var allowed=/^(fr|en|es|de|it|nl|ar)$/;
    var params=new URLSearchParams(location.search);
    var lang=(params.get('lang')||'').toLowerCase();
    try{if(!allowed.test(lang))lang=(localStorage.getItem('digiy-lang')||'').toLowerCase()}catch(e){}
    if(!allowed.test(lang))lang=(navigator.language||'fr').slice(0,2).toLowerCase();
    if(!allowed.test(lang))lang='fr';
    try{
      localStorage.setItem('digiy-lang',lang);
      localStorage.setItem('digiy_mon_commerce_lang',lang==='en'?'en':'fr');
    }catch(e){}
    fetch('./app.html?v='+VERSION,{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('load');
      return r.text();
    }).then(function(html){
      html=html.replace(/<link[^>]+rel=["']canonical["'][^>]*>/i,'');
      html=html.replace(/<meta[^>]+name=["']digiy-build["'][^>]*>/i,'');
      var seo='<meta name="digiy-build" content="mon-commerce-fg-nails-7-langues-20260805">'+
        '<link rel="canonical" href="https://mon-commerce.digiylyfe.com/">'+
        '<link rel="alternate" hreflang="fr" href="https://mon-commerce.digiylyfe.com/fr/">'+
        '<link rel="alternate" hreflang="en" href="https://mon-commerce.digiylyfe.com/en/">'+
        '<link rel="alternate" hreflang="es" href="https://mon-commerce.digiylyfe.com/es/">'+
        '<link rel="alternate" hreflang="de" href="https://mon-commerce.digiylyfe.com/de/">'+
        '<link rel="alternate" hreflang="it" href="https://mon-commerce.digiylyfe.com/it/">'+
        '<link rel="alternate" hreflang="nl" href="https://mon-commerce.digiylyfe.com/nl/">'+
        '<link rel="alternate" hreflang="ar" href="https://mon-commerce.digiylyfe.com/ar/">'+
        '<link rel="alternate" hreflang="x-default" href="https://mon-commerce.digiylyfe.com/">';
      var inject='<base href="./">'+seo+
        '<style id="commerce-language-shell">#digiy-i18n-bar{display:none!important}</style>'+
        '<script>try{localStorage.setItem("digiy-lang","'+lang+'");localStorage.setItem("digiy_mon_commerce_lang","'+(lang==='en'?'en':'fr')+'") }catch(e){}<\/script>'+
        '<script src="./commerce-i18n.js?v='+VERSION+'" defer><\/script>'+
        '<script src="./commerce-public-route.js?v='+VERSION+'" defer><\/script>'+
        '<script src="./commerce-fg-nails.js?v='+VERSION+'" defer><\/script>'+
        '<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"MON COMMERCE","url":"https://mon-commerce.digiylyfe.com/","description":"Commerce local visible en sept langues, contact et paiement directs au commerçant."}<\/script>';
      html=html.replace(/<head([^>]*)>/i,'<head$1>'+inject);
      document.open();document.write(html);document.close();
    }).catch(function(){
      location.replace('https://mon-commerce.digiylyfe.com/app.html?lang='+encodeURIComponent(lang));
    });
  })();
  </script>
