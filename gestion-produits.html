<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MON COMMERCE · Mes produits</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5efe7;color:#2b211b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(780px,calc(100% - 24px));margin:22px auto}.card{background:white;border:1px solid #e5d8ca;border-radius:20px;padding:16px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap}input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #e5d8ca;border-radius:10px}.half{flex:1;min-width:180px}.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:900;background:#173b31;color:white}.ghost{background:white;color:#2b211b;border:1px solid #e5d8ca}.danger{background:#8a2a2a}.product{display:grid;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #eee}.msg{font-size:12px;color:#79695d}.bad{color:#8a2a2a}
</style></head><body><main class="wrap"><div class="card"><strong>🛍️ MON COMMERCE · Gestion propriétaire</strong><p id="status" class="msg">Vérification de votre accès…</p><div class="row"><a id="back" class="btn ghost" href="./index.html">← Retour à la fiche</a><button id="logout" class="btn ghost">Déconnexion</button></div></div><section id="editor" class="card" hidden><h2>Produits</h2><div class="row"><input class="half" id="name" placeholder="Nom du produit"><input class="half" id="price" placeholder="Prix affiché"><input class="half" id="stock" placeholder="Disponibilité / stock"></div><textarea id="description" rows="3" placeholder="Description"></textarea><input id="image" placeholder="URL image publique"><button id="add" class="btn">Ajouter le produit</button><div id="products"></div></section></main><script>
(async()=>{const sb=window.supabase.createClient("https://wesqmwjjtsefyjnluosj.supabase.co","sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),p=new URL(location.href).searchParams,site=(p.get("site")||"").trim(),ret=p.get("return")||"./index.html";try{const u=new URL(ret,location.origin);if(u.origin===location.origin||u.hostname.endsWith(".digiylyfe.com"))$("back").href=u.href}catch(_){}const {data:{user}}=await sb.auth.getUser();if(!user){$("status").textContent="Connexion requise.";return}const {data:s,error:se}=await sb.from("digiy_commerce_sites").select("slug,name").eq("slug",site).eq("auth_user_id",user.id).eq("is_active",true).maybeSingle();if(se||!s){$("status").classList.add("bad");$("status").textContent="Cet email n’est pas autorisé pour ce commerce.";return}$("status").textContent="Accès confirmé · "+s.name;$("editor").hidden=false;async function load(){const {data,error}=await sb.from("digiy_commerce_products").select("id,name,description,price_label,stock_label,image_url,position,is_active").eq("site_slug",site).order("position",{ascending:true});if(error){$("status").textContent=error.message;return}$("products").innerHTML="";(data||[]).forEach(x=>{const d=document.createElement("div");d.className="product";d.innerHTML='<strong></strong><div class="msg"></div><div class="row"><button class="btn ghost edit">Modifier</button><button class="btn danger del">Supprimer</button></div>';d.querySelector("strong").textContent=x.name;d.querySelector(".msg").textContent=[x.price_label,x.stock_label].filter(Boolean).join(" · ");d.querySelector(".edit").onclick=async()=>{const name=prompt("Nom",x.name);if(name===null)return;const price=prompt("Prix affiché",x.price_label||"");const stock=prompt("Disponibilité / stock",x.stock_label||"");const {error}=await sb.from("digiy_commerce_products").update({name,price_label:price,stock_label:stock,updated_at:new Date().toISOString()}).eq("id",x.id);if(error)alert(error.message);else load()};d.querySelector(".del").onclick=async()=>{if(!confirm("Supprimer ce produit ?"))return;const {error}=await sb.from("digiy_commerce_products").delete().eq("id",x.id);if(error)alert(error.message);else load()};$("products").appendChild(d)})} $("add").onclick=async()=>{const name=$("name").value.trim();if(!name)return alert("Nom requis");const {data:last}=await sb.from("digiy_commerce_products").select("position").eq("site_slug",site).order("position",{ascending:false}).limit(1);const position=(last?.[0]?.position||0)+10;const {error}=await sb.from("digiy_commerce_products").insert({site_slug:site,name,description:$("description").value.trim()||null,price_label:$("price").value.trim()||null,stock_label:$("stock").value.trim()||null,image_url:$("image").value.trim()||null,position,is_active:true});if(error)alert(error.message);else{$("name").value=$("price").value=$("stock").value=$("description").value=$("image").value="";load()}};$("logout").onclick=async()=>{await sb.auth.signOut();location.href=$("back").href};load()})();
</script></body></html>
