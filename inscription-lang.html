<script>
(function(){
  var p=new URLSearchParams(location.search);
  var raw=String(p.get('country')||p.get('pays')||'sn').toLowerCase();
  var country=raw==='fr'||raw==='france'?'fr':raw==='us'||raw==='usa'?'us':'sn';
  var lang=String(p.get('lang')||'fr').slice(0,2).toLowerCase();
  if(!['fr','en','es','pt','de','it','nl','ar'].includes(lang))lang='fr';
  var u=new URL('https://digiylyfe.com/tarifs-adherents-1.html');
  u.searchParams.set('country',country);
  u.searchParams.set('lang',lang);
  location.replace(u.toString());
})();
</script>
