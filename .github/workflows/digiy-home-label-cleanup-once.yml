name: Clean obsolete HUB labels once
on:
  push:
    paths: ['.github/workflows/digiy-home-label-cleanup-once.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['fiche-astou.html','inscription-pos.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8'); before=s
              s=s.replace('https://digiy-hub.digiylyfe.com/','https://digiylyfe.com/')
              if s.count('href="https://digiylyfe.com/"') > 1:
                  s=re.sub(r'\s*<a\b[^>]*href="https://digiylyfe\.com/"[^>]*>\s*(?:🧭\s*)?HUB\s*</a>','',s,flags=re.I)
              if s!=before: p.write_text(s,encoding='utf-8')
          PY
          git config user.name "DIGIYLYFE maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/digiy-home-label-cleanup-once.yml
          git add -A
          git commit -m "Navigation: remove obsolete HUB labels from COMMERCE"
          git push origin HEAD:main
