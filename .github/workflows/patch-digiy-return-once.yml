name: Patch MON COMMERCE DIGIYLYFE return once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible DIGIYLYFE.COM return
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          label='← RETOUR DIGIYLYFE.COM'
          if label in s:
              print('Already patched')
              raise SystemExit(0)
          marker='<div class="wrap">\n  <div class="headtop">'
          button='''<div class="wrap">\n  <a href="https://digiylyfe.com/" aria-label="Retour DIGIYLYFE.COM" style="width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;margin:0 0 12px;padding:11px 18px;border:2px solid #d8ad46;border-radius:999px;background:#fffefa;color:#073f32;text-decoration:none;font:1000 15px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.02em;box-shadow:0 8px 20px rgba(0,0,0,.18)">← RETOUR DIGIYLYFE.COM</a>\n  <div class="headtop">'''
          if marker not in s:
              raise SystemExit('Expected MON COMMERCE header marker not found; refusing unrelated change')
          p.write_text(s.replace(marker,button,1),encoding='utf-8')
          PY
      - name: Commit exact change
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "UI: add visible DIGIYLYFE.COM return on MON COMMERCE"
          git push
