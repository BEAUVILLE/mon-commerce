name: Patch POS inscription SMS BOOST RESEAU

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-pos-sms-boost-reseau.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch inscription POS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('inscription-pos.html')
          html = path.read_text(encoding='utf-8')
          before = html

          html = html.replace('Choisis Caisse ou Duo commerce.', 'Choisis Caisse, Duo commerce, BOOST ou RÉSEAU.')
          html = html.replace('🚀 Activer POS', '📱 WhatsApp / SMS')
          html = html.replace(
            '<div class="actions"><a class="btn" id="btnWa" href="https://wa.me/221771342889?text=Bonjour%20JB%2C%20je%20veux%20activer%20MON%20COMMERCE">💬 WhatsApp</a><a class="btn green" id="btnActivate" href="https://commencer-a-payer.digiylyfe.com/?module=POS">Activer mon module POS</a></div><p class="note">Après activation, le pro ouvre son espace commerce. Les ventes restent en POS ; l’argent final remonte vers PAY.</p>',
            '<div class="actions"><a class="btn" id="btnWa" href="https://wa.me/221771342889?text=Bonjour%20JB%2C%20je%20veux%20activer%20MON%20COMMERCE">💬 WhatsApp</a><button class="btn green" id="btnSms" type="button">📱 SMS</button></div><p class="note">Choisis ton tarif, puis contacte JB par WhatsApp ou SMS. Les ventes restent en POS ; l’argent final remonte vers PAY.</p>'
          )

          script_start = html.find('  <script>\n    (function(){"use strict";const PLANS=')
          script_end = html.find('\n  </script>', script_start)
          if script_start != -1 and script_end != -1:
              new_script = r'''  <script>
    (function(){
      "use strict";
      const SUPPORT_WA = "221771342889";
      const PLANS = [
        {
          code:"5",
          module:"POS",
          name:"Mon commerce — Caisse",
          amount:"19 900 FCFA · 29 €",
          fcfa:19900,
          desc:"Caisse mobile, produits, quantités, total, ticket et stock.",
          bonus:["Caisse téléphone","Produits et prix enregistrés","Vente par clic ou par voix","Ticket / total préparé","Stock et alertes simples"]
        },
        {
          code:"56",
          module:"PACK",
          name:"Duo commerce — Caisse + boutique",
          amount:"29 900 FCFA · 49 €",
          fcfa:29900,
          desc:"POS + présence boutique visible pour attirer et vendre.",
          bonus:["Caisse POS incluse","Vitrine boutique / produits","QR et lien partageable","WhatsApp direct client","Pack commerce plus complet"]
        },
        {
          code:"E2",
          module:"EXPLORE_BOOST",
          name:"BOOST visibilité — Standard",
          amount:"10 000 FCFA · 19 €",
          fcfa:10000,
          desc:"Mise en avant d’une fiche commerce déjà active.",
          bonus:["Visibilité renforcée","Mise en avant locale","Meilleure circulation du lien","Utile après activation du commerce"]
        },
        {
          code:"RD1",
          module:"RESEAU_DIGIY",
          name:"RÉSEAU DIGIY — Mise en classe FIRST",
          amount:"150 000 FCFA · 1 mois",
          fcfa:150000,
          desc:"Présence premium, fiche finie, QR, lien, message prêt et visibilité qualifiée.",
          bonus:["Fiche/vitrine premium","QR et lien partageable","Message prêt à faire circuler","Visibilité qualifiée 1 mois","Positionnement noble, pas open-bar"]
        }
      ];
      const COMMON = [
        "Carte de visite complète : nom, métier, adresse, téléphone",
        "QR code vers la fiche commerce",
        "Logiciel de gestion métier fourni avec le module",
        "Voix DIGIY pour préparer la vente plus vite",
        "Textes prêts à envoyer au client",
        "Validation humaine par clic",
        "0% commission"
      ];
      const grid=document.getElementById("posOptions"),
        selected=document.getElementById("selectedBox"),
        benefits=document.getElementById("benefits"),
        btnWa=document.getElementById("btnWa"),
        btnSms=document.getElementById("btnSms"),
        summary=document.getElementById("summary");
      let current=null;

      function render(){
        grid.innerHTML=PLANS.map(p=>`<button class="option${current&&current.code===p.code?" active":""}" type="button" data-code="${p.code}"><span class="code">${p.code}</span><span class="name">${p.name}</span><span class="amount">${p.amount}</span><span class="desc">${p.desc}</span></button>`).join("");
        document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>select(b.dataset.code,true)));
      }

      function buildMessage(){
        if(!current) select("5",false);
        return `Bonjour JB, je veux activer MON COMMERCE.\nCode : ${current.code}\nModule : ${current.module}\nMontant : ${current.fcfa} FCFA.\nCanal souhaité : WhatsApp ou SMS.`;
      }

      function syncContact(){
        btnWa.href="https://wa.me/"+SUPPORT_WA+"?text="+encodeURIComponent(buildMessage());
      }

      function select(code,scroll){
        current=PLANS.find(p=>p.code===code)||PLANS[0];
        render();
        selected.innerHTML=`<strong>${current.name}</strong><span>${current.amount} · ${current.desc}</span>`;
        benefits.innerHTML=[...COMMON,...current.bonus].map(x=>`<li>✅ ${x}</li>`).join("");
        syncContact();
        if(scroll&&matchMedia("(max-width:860px)").matches){summary.scrollIntoView({behavior:"smooth",block:"start"})}
      }

      function copySms(){
        const msg=buildMessage();
        if(navigator.clipboard){
          navigator.clipboard.writeText(msg).then(()=>{
            const old=btnSms.textContent;
            btnSms.textContent="✅ Message SMS copié";
            setTimeout(()=>btnSms.textContent=old,1600);
          }).catch(()=>{btnSms.textContent="📱 SMS : 77 134 28 89";});
        }else{
          btnSms.textContent="📱 SMS : 77 134 28 89";
        }
      }

      function speakText(){
        if(!current)select("5",false);
        return `Module Mon Commerce, DIGIY POS. ${current.name}, ${current.amount}. POS détaille la vente : produit, quantité, total, ticket et stock. PAY lit l’argent final. Le commerçant garde la main.`
          .replace(/\bDIGIY\b/g,"diji i").replace(/\bPAY\b/g,"paï").replace(/\bPOS\b/g,"caisse");
      }

      document.getElementById("btnAudio").addEventListener("click",()=>{
        if(!("speechSynthesis" in window))return;
        window.speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(speakText());
        u.lang="fr-FR";u.rate=.86;u.pitch=1.02;
        window.speechSynthesis.speak(u);
      });
      document.getElementById("btnStop").addEventListener("click",()=>{if("speechSynthesis" in window)window.speechSynthesis.cancel()});
      document.getElementById("btnFloating").addEventListener("click",()=>{if(!current)select("5",false);summary.scrollIntoView({behavior:"smooth",block:"start"})});
      if(btnSms) btnSms.addEventListener("click",copySms);
      render();select("5",false);
    })();'''
              html = html[:script_start] + new_script + html[script_end:]

          if html != before:
              path.write_text(html, encoding='utf-8')
              print('Patch POS SMS BOOST RESEAU appliqué')
          else:
              print('Aucun changement détecté')
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inscription-pos.html
          git commit -m "Add SMS BOOST and RESEAU to POS inscription"
          git push
