name: Patch index link to POS inscription

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-index-link-inscription-pos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Link index to inscription-pos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          before = html
          target = './inscription-pos.html'
          html = html.replace('https://commencer-a-payer.digiylyfe.com/?module=POS', target)
          html = html.replace('Activer mon commerce', 'Inscription commerce')
          html = html.replace('Activation commerce', 'Inscription commerce')
          html = html.replace('pay-public-20260510-v1-doctrine', 'mon-commerce-inscription-pos-20260529')
          if html != before:
              path.write_text(html, encoding='utf-8')
              print('Index MON COMMERCE relié à inscription-pos.html')
          else:
              print('Aucun changement détecté')
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link MON COMMERCE index to POS inscription"
          git push
