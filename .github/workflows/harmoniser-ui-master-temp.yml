name: Harmoniser UI MON COMMERCE temporaire

on:
  push:
    paths:
      - '.github/workflows/harmoniser-ui-master-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Brancher UI MASTER partagée
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'digiy-master-ui-v1.css' not in s:
              s=s.replace('<title>MON COMMERCE — Commerces locaux · Contact direct</title>','<title>MON COMMERCE — Commerces locaux · Contact direct</title>\n<link rel="stylesheet" href="https://digiylyfe.com/assets/digiy-master-ui-v1.css?v=20260830-v1">',1)
          s=s.replace('<body>','<body data-digiy-master-ui="commerce">',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F 'digiy-master-ui-v1.css?v=20260830-v1' index.html
          grep -F 'data-digiy-master-ui="commerce"' index.html
      - name: Publier et nettoyer
        run: |
          set -euo pipefail
          rm -f .github/workflows/harmoniser-ui-master-temp.yml
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/harmoniser-ui-master-temp.yml
          git commit -m 'MASTER: aligner MON COMMERCE sur UI DIGIYLYFE'
          git push origin main
